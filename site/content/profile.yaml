  identity: "I build tools that find, explain, and fix performance problems in cloud and distributed systems, combining program analysis, empirical studies, and Artificial Intelligence (LLMs)."
  bio: >-
    I am a Ph.D. candidate in Computer and Information Science at the University of Michigan-Dearborn, advised by
    Dr. Probir Roy. My research spans computer systems, distributed systems, cloud computing, software engineering,
    and artificial intelligence (AI), with a focus on performance observability and optimization.

    My dissertation, *Cross-Layer Performance Observability and Optimization in Cloud Systems*, turns the performance
    signals that cloud systems already expose into evidence that shows developers what to fix and where: in how
    microservices exchange data, how serverless functions start, and how systems are configured.

    Before my Ph.D., I spent more than six years building Java enterprise applications using service-oriented architecture.
